name: Build from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract zip
        run: unzip -q neptunium.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build mod
        working-directory: neptunium
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: neptunium-jar
          path: neptunium/build/libs/*.jar
